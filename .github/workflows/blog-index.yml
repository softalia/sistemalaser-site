name: Build blog index

on:
  push:
    paths:
      - "blog/**/*.html"
      - "scripts/build-blog-index.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-blog-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-blog-index.mjs
      - name: Commit generated index
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update blog post index"
          file_pattern: blog/posts.json
