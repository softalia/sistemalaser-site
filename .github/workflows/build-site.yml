name: Build and publish site

on:
  push:
    branches:
      - main
      - master
    paths:
      - "blog/posts.json"
      - "blog/images/**"
      - "*.html"
      - "assets/**"
      - "assets/js/header-2026.js"
      - "assets/js/footer-2026.js"
      - "scripts/**/*.mjs"
      - "Makefile"
      - "CNAME"
      - "robots.txt"
      - "llms.txt"
      - ".github/workflows/build-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build dist and deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and validate static site
        run: make validate

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dist artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
